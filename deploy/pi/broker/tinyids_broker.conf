# Our own Mosquitto for TinyIDS, next to the lab's broker (which stays on port 1883).
# Start: mosquitto -c /home/pi/tinyids/broker/tinyids_broker.conf -d      Stop: pkill -f tinyids_broker.conf
listener 1884 0.0.0.0
allow_anonymous false
password_file /home/pi/tinyids/broker/passwd
persistence false
